[project]
name = "mini-llm-systems-runtime"
version = "0.1.0"
description = "A compact LLM implementation and systems runtime."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8",
    "numpy>=2.4",
    "regex>=2026.3.32",
    "safetensors>=0.8.0",
    "torch~=2.11.0",
    "transformers>=5.16.1",
]

[project.optional-dependencies]
triton = [
    "triton~=3.6.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "psutil>=7",
    "pytest>=9.0",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "mini_llm_runtime"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
